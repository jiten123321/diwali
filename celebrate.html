<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05020a">
<title>Happy Diwali, Ladoo ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&display=swap">
<style>
  :root{color-scheme:dark;}
  html,body{margin:0;height:100%;overflow:hidden;background:#05020a;}
  body{animation:fadeIn 1.4s ease both;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:pointer;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* night sky: deep gradient with a faint warm glow low on the horizon */
  .sky{position:fixed;inset:0;background:
      radial-gradient(90% 45% at 50% 115%,rgba(255,120,60,.16),transparent 70%),
      radial-gradient(70% 60% at 70% 20%,rgba(70,30,110,.35),transparent 70%),
      linear-gradient(#05020a 0%,#0d0518 45%,#1c0718 100%);}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* the one button: on to the flowers */
  .next{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:5;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1);
    padding:16px 30px;border-radius:999px;border:0;text-decoration:none;white-space:nowrap;
    background:linear-gradient(180deg,#d45c86,#b23a64);color:#fbf4ec;font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-size:19px;
    box-shadow:0 10px 30px rgba(178,58,100,.45),inset 0 1px 0 rgba(255,255,255,.25);}
  .next.in{opacity:1;transform:translate(-50%,0);pointer-events:auto;animation:breathe 2.4s ease-in-out 1.2s infinite;}
  @keyframes breathe{50%{box-shadow:0 12px 36px rgba(178,58,100,.6),0 0 0 8px rgba(212,92,134,.12),inset 0 1px 0 rgba(255,255,255,.25)}}
  /* shown only while the browser is still holding the sound back (iPhones need one tap) */
  .tap-sound{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));z-index:6;transform:translate(-50%,-10px);opacity:0;
    padding:10px 18px;border-radius:999px;background:rgba(20,8,20,.6);border:1px solid rgba(255,220,170,.35);color:#ffe2b0;
    font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-size:16px;white-space:nowrap;pointer-events:none;
    transition:opacity .6s ease, transform .6s ease;}
  .tap-sound.show{opacity:1;transform:translate(-50%,0);animation:tapPulse 2s ease-in-out infinite;}
  @keyframes tapPulse{50%{box-shadow:0 0 0 8px rgba(255,210,150,.10)}}
  .veil{position:fixed;inset:0;z-index:9;background:#05020a;opacity:0;pointer-events:none;transition:opacity .7s;}
  .veil.on{opacity:1;}
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="fireworks" aria-hidden="true"></canvas>

  <div class="tap-sound" id="tapSound" aria-hidden="true">🔊 Tap anywhere for sound</div>
  <a class="next" id="next" href="bouquet.html">One more thing… 🌹</a>
  <div class="veil" id="veil"></div>

<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  let W, H;

  /* ---------------- stars ---------------- */
  const sc = document.getElementById('stars'), s2 = sc.getContext('2d');
  let stars = [];
  function makeStars(){
    stars = Array.from({ length: Math.round(W * H / 3500) }, () => ({
      x: Math.random() * W, y: Math.random() * H * .85, r: Math.random() < .9 ? rnd(.3, 1) : rnd(1, 1.7),
      a: rnd(.3, 1), t: Math.random() * 6.28, ts: rnd(.005, .03) }));
  }
  function drawStars(){
    s2.clearRect(0, 0, W, H);
    for(const s of stars){
      s.t += s.ts;
      s2.globalAlpha = s.a * (.55 + .45 * Math.sin(s.t));
      s2.fillStyle = '#fff6e8'; s2.beginPath(); s2.arc(s.x, s.y, s.r, 0, 6.29); s2.fill();
    }
    s2.globalAlpha = 1;
  }

  /* ---------------- firework sounds ----------------
     Plain <audio> players (not Web Audio): this is what iPhones reliably play, in every
     browser and even with the silent switch on, once the page has been tapped once.
     Bursts use real firework recordings with a light outdoor echo (assets/sfx/boom*.mp3,
     from fireworks-js, MIT licence); rockets whistle, then pop and crackle. */
  const SFX = {
    boom:    ['assets/sfx/boom0.mp3', 'assets/sfx/boom1.mp3', 'assets/sfx/boom2.mp3'],
    launch:  ['assets/sfx/launch.mp3'],
    whistle: ['assets/sfx/whistle.mp3'],
    pop:     ['assets/sfx/pop.mp3'],
  };
  const COPIES = { boom: 4, launch: 4, whistle: 4, pop: 4 };   // players per file, so sounds can overlap
  const pool = {};
  for(const [k, files] of Object.entries(SFX)){
    pool[k] = [];
    files.forEach(src => { for(let i = 0; i < COPIES[k]; i++){ const el = new Audio(src); el.preload = 'auto'; el.setAttribute('playsinline', ''); pool[k].push(el); } });
  }
  let unlocked = false, soundOn = true;
  function play(kind, volume, delay = 0, rate = 1){
    if(!soundOn) return;
    const list = pool[kind]; if(!list) return;
    const free = list.filter(el => el.paused || el.ended);
    const el = (free.length ? free : list)[Math.floor(Math.random() * (free.length || list.length))];
    const go = () => {
      try{
        el.muted = false; el.volume = Math.max(0, Math.min(1, volume));
        el.playbackRate = rate; if('preservesPitch' in el) el.preservesPitch = false; if('webkitPreservesPitch' in el) el.webkitPreservesPitch = false;
        el.currentTime = 0;
        const pr = el.play(); if(pr && pr.then) pr.then(markUnlocked, () => {});
      }catch(e){}
    };
    delay ? setTimeout(go, delay) : go();
  }
  function soundLaunch(x, dur){ play('launch', .55, 0, rnd(.9, 1.1)); }
  function soundRocket(x, dur){ play('whistle', .5, 0, Math.max(.8, Math.min(1.25, 1 / dur))); }
  function soundPop(x, y){ play('pop', .6, 60); }
  function soundBoom(x, y, size){
    const far = Math.max(0, Math.min(1, 1 - y / H));               // higher bursts feel further away
    play('boom', (.7 + .3 * size) * (1 - far * .35), 80 + far * 300, rnd(.86, 1.1));
  }

  /* unlock: the first touch plays every player silently once, which iPhones require */
  const tapSound = document.getElementById('tapSound');
  function markUnlocked(){ if(!unlocked){ unlocked = true; tapSound.classList.remove('show'); } }
  function unlock(){
    if(unlocked) return;
    try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
    Object.values(pool).flat().forEach(el => {
      try{
        el.muted = true;
        const pr = el.play();
        if(pr && pr.then) pr.then(() => { el.pause(); el.currentTime = 0; el.muted = false; markUnlocked(); }, () => { el.muted = false; });
        else { el.pause(); el.muted = false; }
      }catch(e){}
    });
  }
  ['touchend', 'click', 'pointerup', 'keydown', 'touchstart', 'pointerdown'].forEach(ev => addEventListener(ev, unlock, { capture: true, passive: true }));
  // try straight away: browsers that allow sound without a tap (e.g. desktop Chrome) start at once
  (function probe(){
    const el = pool.pop[0]; el.muted = true;
    const pr = el.play();
    if(pr && pr.then) pr.then(() => { el.pause(); el.currentTime = 0; el.muted = false; markUnlocked(); }, () => { el.muted = false; });
  })();
  setTimeout(() => { if(!unlocked) tapSound.classList.add('show'); }, 700);

  /* ---------------- fireworks ---------------- */
  const cv = document.getElementById('fireworks'), c = cv.getContext('2d');
  const PALETTES = [
    [[255, 214, 120], [255, 180, 70]], [[255, 120, 170], [255, 200, 225]], [[255, 140, 60], [255, 225, 150]],
    [[190, 120, 255], [255, 170, 225]], [[130, 225, 255], [255, 255, 255]], [[255, 85, 90], [255, 205, 120]], [[150, 255, 170], [255, 245, 170]],
  ];
  const rockets = [], sparks = [];
  function launch(tx, ty){
    const x = tx ?? rnd(W * .1, W * .9), y = ty ?? rnd(H * .12, H * .45);
    const sx = x + rnd(-W * .06, W * .06), frames = 55 + Math.random() * 15;
    rockets.push({ x: sx, y: H + 10, ty: y, vx: (x - sx) / frames, vy: -(H + 10 - y) / frames, t: 0, max: frames + 15 });
    soundLaunch(sx, frames / 60);
  }
  /* Diwali rockets: fast, wobbly streaks with a thick spark tail and a whistle, ending in a crackling pop */
  function rocket(sx){
    sx = sx ?? rnd(W * .08, W * .92);
    const ty = rnd(H * .08, H * .32), frames = rnd(42, 58);
    rockets.push({ rocket: true, x: sx, y: H + 10, ty, vx: rnd(-1.2, 1.2), vy: -(H + 10 - ty) / frames, t: 0, max: frames + 20,
      wob: rnd(.6, 1.6), wf: rnd(.18, .3), ph: Math.random() * 6.28 });
    soundRocket(sx, frames / 60);
  }
  function volley(){
    const n = 2 + Math.floor(Math.random() * 3), base = rnd(W * .2, W * .8);
    for(let i = 0; i < n; i++) setTimeout(() => rocket(Math.max(W * .06, Math.min(W * .94, base + rnd(-W * .25, W * .25)))), i * rnd(120, 260));
  }
  function popRocket(x, y){
    const scale = Math.max(.8, Math.min(W, H) / 420), col = Math.random() < .5 ? [255, 236, 190] : [255, 205, 120];
    for(let i = 0; i < 48; i++){
      const a = Math.random() * 6.28, sp = rnd(.6, 2.6) * scale;
      sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(40, 70), max: 70, g: .035, col, w: rnd(1, 1.8), twinkle: true, crackle: true });
    }
    sparks.push({ flash: true, x, y, life: 7, max: 7, col: [255, 240, 200], r: 70 * scale });
    soundPop(x, y);
  }
  function explode(x, y){
    const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    const kind = Math.random(), scale = Math.max(.8, Math.min(W, H) / 420);
    const ring = kind < .2, willow = kind > .8, crackle = kind > .6 && kind <= .8;
    const n = ring ? 170 : 140, speed = rnd(3.2, 4.8) * scale;
    for(let i = 0; i < n; i++){
      const a = (i / n) * Math.PI * 2 + rnd(-.05, .05);
      const s = speed * (ring ? 1 : Math.cbrt(Math.random()));
      sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: willow ? rnd(110, 150) : rnd(70, 110), max: willow ? 150 : 110, g: willow ? .055 : .04,
        col: willow ? [255, 200, 110] : (Math.random() < .75 ? pal[0] : pal[1]), w: rnd(1.4, 2.6),
        twinkle: Math.random() < .3, crackle });
    }
    sparks.push({ flash: true, x, y, life: 12, max: 12, col: pal[0], r: 150 * scale });
    soundBoom(x, y, Math.min(1, .55 + scale * .25));
  }
  function frame(){
    drawStars();
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i]; r.t++;
      const px = r.x, py = r.y;
      if(r.rocket){
        // a wobbly, fast streak with a bright head and a thick tail of sparks
        r.x += r.vx + Math.sin(r.t * r.wf + r.ph) * r.wob; r.y += r.vy;
        c.strokeStyle = 'rgba(255,240,200,.95)'; c.lineWidth = 2.6;
        c.beginPath(); c.moveTo(px, py); c.lineTo(r.x, r.y); c.stroke();
        const hg = c.createRadialGradient(r.x, r.y, 0, r.x, r.y, 9);
        hg.addColorStop(0, 'rgba(255,250,230,.95)'); hg.addColorStop(1, 'rgba(255,190,90,0)');
        c.fillStyle = hg; c.beginPath(); c.arc(r.x, r.y, 9, 0, 6.29); c.fill();
        for(let k = 0; k < 4; k++) sparks.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: rnd(-.9, .9), vy: rnd(.6, 2.4), life: rnd(16, 34), max: 34, g: .045,
          col: Math.random() < .6 ? [255, 210, 120] : [255, 245, 220], w: rnd(.8, 1.6), twinkle: Math.random() < .5 });
        if(r.y <= r.ty || r.t > r.max){ popRocket(r.x, r.y); rockets.splice(i, 1); }
        continue;
      }
      r.x += r.vx; r.y += r.vy;
      c.strokeStyle = 'rgba(255,225,170,.95)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(px, py); c.lineTo(r.x, r.y); c.stroke();
      if(Math.random() < .7) sparks.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: rnd(-.4, .4), vy: rnd(.4, 1.4), life: 22, max: 22, g: .02, col: [255, 190, 110], w: 1 });
      if(r.y <= r.ty || r.t > r.max){ explode(r.x, r.y); rockets.splice(i, 1); }
    }
    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i]; s.life--;
      if(s.life <= 0){ sparks.splice(i, 1); continue; }
      const al = s.life / s.max;
      if(s.flash){
        const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
        g.addColorStop(0, `rgba(${s.col},${.6 * al})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = g; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.29); c.fill(); continue;
      }
      s.px = s.x; s.py = s.y; s.vx *= .978; s.vy = s.vy * .978 + s.g; s.x += s.vx; s.y += s.vy;
      let a = al;
      if(s.twinkle) a *= .5 + Math.random() * .5;
      if(s.crackle && al < .4 && Math.random() < .35) a = 1;
      c.strokeStyle = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${a})`; c.lineWidth = s.w;
      c.beginPath(); c.moveTo(s.px, s.py); c.lineTo(s.x, s.y); c.stroke();
    }
    requestAnimationFrame(frame);
  }

  function size(){
    const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    for(const [el, ctx] of [[cv, c], [sc, s2]]){ el.width = W * d; el.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    makeStars();
  }
  size(); addEventListener('resize', size);

  /* the button to the flowers */
  const next = document.getElementById('next');
  setTimeout(() => next.classList.add('in'), reduce ? 300 : 6000);
  next.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    document.getElementById('veil').classList.add('on');
    setTimeout(() => { location.href = next.href; }, 700);
  });
  next.addEventListener('pointerdown', e => e.stopPropagation());

  if(reduce){ drawStars(); return; }
  requestAnimationFrame(frame);
  [700, 1100, 1500, 1800, 2200].forEach(t => setTimeout(() => launch(), t));
  (function loop(){
    if(!document.hidden){ launch(); if(Math.random() < .35) setTimeout(() => launch(), 260); }
    setTimeout(loop, rnd(900, 1800));
  })();
  setTimeout(volley, 2800);
  (function rocketLoop(){
    if(!document.hidden){ Math.random() < .6 ? volley() : rocket(); }
    setTimeout(rocketLoop, rnd(2200, 4200));
  })();
  // tap the sky for your own firework
  addEventListener('pointerdown', e => {
    if(e.target.closest('.next')) return;
    launch(e.clientX, Math.min(e.clientY, H * .65));
  });
})();
</script>
</body>
</html>
