<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05020a">
<title>Happy Diwali, Ladoo ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&display=swap">
<style>
  :root{color-scheme:dark;}
  html,body{margin:0;height:100%;overflow:hidden;background:#05020a;}
  body{animation:fadeIn 1.4s ease both;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:pointer;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* night sky: deep gradient with a faint warm glow low on the horizon */
  .sky{position:fixed;inset:0;background:
      radial-gradient(90% 45% at 50% 115%,rgba(255,120,60,.16),transparent 70%),
      radial-gradient(70% 60% at 70% 20%,rgba(70,30,110,.35),transparent 70%),
      linear-gradient(#05020a 0%,#0d0518 45%,#1c0718 100%);}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* sound: tiny speaker icon, pulses until sound is on */
  .sound{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,220,170,.35);background:rgba(20,8,20,.5);display:grid;place-items:center;cursor:pointer;padding:0;}
  .sound svg{width:20px;height:20px;fill:none;stroke:#ffe2b0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .sound .wave{transition:opacity .3s;}
  .sound:not(.on) .wave{opacity:0;}
  .sound:not(.on){animation:nudge 1.8s ease-in-out infinite;}
  .sound:not(.on) .x{opacity:1;} .sound.on .x{opacity:0;}
  @keyframes nudge{50%{box-shadow:0 0 0 8px rgba(255,210,150,.12)}}

  /* the one button: on to the flowers */
  .next{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:5;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1);
    padding:16px 30px;border-radius:999px;border:0;text-decoration:none;white-space:nowrap;
    background:linear-gradient(180deg,#d45c86,#b23a64);color:#fbf4ec;font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-size:19px;
    box-shadow:0 10px 30px rgba(178,58,100,.45),inset 0 1px 0 rgba(255,255,255,.25);}
  .next.in{opacity:1;transform:translate(-50%,0);pointer-events:auto;animation:breathe 2.4s ease-in-out 1.2s infinite;}
  @keyframes breathe{50%{box-shadow:0 12px 36px rgba(178,58,100,.6),0 0 0 8px rgba(212,92,134,.12),inset 0 1px 0 rgba(255,255,255,.25)}}
  .veil{position:fixed;inset:0;z-index:9;background:#05020a;opacity:0;pointer-events:none;transition:opacity .7s;}
  .veil.on{opacity:1;}
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="fireworks" aria-hidden="true"></canvas>

  <button class="sound" id="sound" aria-label="Turn firework sounds on" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#ffe2b0" stroke="none"/>
      <path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
      <path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <a class="next" id="next" href="bouquet.html">One more thing… 🌹</a>
  <div class="veil" id="veil"></div>

<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  let W, H;

  /* ---------------- stars ---------------- */
  const sc = document.getElementById('stars'), s2 = sc.getContext('2d');
  let stars = [];
  function makeStars(){
    stars = Array.from({ length: Math.round(W * H / 3500) }, () => ({
      x: Math.random() * W, y: Math.random() * H * .85, r: Math.random() < .9 ? rnd(.3, 1) : rnd(1, 1.7),
      a: rnd(.3, 1), t: Math.random() * 6.28, ts: rnd(.005, .03) }));
  }
  function drawStars(){
    s2.clearRect(0, 0, W, H);
    for(const s of stars){
      s.t += s.ts;
      s2.globalAlpha = s.a * (.55 + .45 * Math.sin(s.t));
      s2.fillStyle = '#fff6e8'; s2.beginPath(); s2.arc(s.x, s.y, s.r, 0, 6.29); s2.fill();
    }
    s2.globalAlpha = 1;
  }

  /* ---------------- firework sounds (synthesised, no files) ---------------- */
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac, master, noiseBuf, soundOn = false;
  function initAudio(){
    if(ac || !AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = .9;
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function out(x){
    const g = ac.createGain();
    if(ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, (x / W) * 1.6 - .8)); g.connect(p); p.connect(master); }
    else g.connect(master);
    return g;
  }
  function noise(t, dur){ const n = ac.createBufferSource(); n.buffer = noiseBuf; n.start(t, Math.random(), dur); return n; }
  function soundLaunch(x, dur){
    if(!soundOn) return;
    const t = ac.currentTime, n = noise(t, dur + .1), bp = ac.createBiquadFilter(), g = out(x);
    bp.type = 'bandpass'; bp.Q.value = 6;
    bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(2600, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .08); g.gain.linearRampToValueAtTime(.05, t + dur);
    g.gain.linearRampToValueAtTime(0, t + dur + .08);
    n.connect(bp); bp.connect(g);
    if(Math.random() < .4){ // the odd whistling rocket
      const o = ac.createOscillator(), og = out(x);
      o.type = 'sine'; o.frequency.setValueAtTime(1300, t); o.frequency.exponentialRampToValueAtTime(2900, t + dur);
      og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(.025, t + .1); og.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(og); o.start(t); o.stop(t + dur + .05);
    }
  }
  function soundBoom(x, size, crackle){
    if(!soundOn) return;
    const t = ac.currentTime + .02;
    // the bang: a short noise burst through a low-pass, with a long decaying tail
    const n = noise(t, 2.2), lp = ac.createBiquadFilter(), g = out(x);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(180, t + 1.2);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.9 * size, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + 2);
    n.connect(lp); lp.connect(g);
    // the thump you feel
    const o = ac.createOscillator(), og = out(x);
    o.type = 'sine'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(32, t + .5);
    og.gain.setValueAtTime(.8 * size, t); og.gain.exponentialRampToValueAtTime(.001, t + .7);
    o.connect(og); o.start(t); o.stop(t + .75);
    if(crackle){
      for(let i = 0; i < 26; i++){
        const ct = t + .55 + Math.random() * 1.1, cn = noise(ct, .03), hp = ac.createBiquadFilter(), cg = out(x + rnd(-80, 80));
        hp.type = 'highpass'; hp.frequency.value = 2500;
        cg.gain.setValueAtTime(rnd(.05, .16), ct); cg.gain.exponentialRampToValueAtTime(.001, ct + .03);
        cn.connect(hp); hp.connect(cg);
      }
    }
  }
  const soundBtn = document.getElementById('sound');
  function setSound(on){
    initAudio(); if(!ac) return;
    soundOn = on; if(on) ac.resume();
    soundBtn.classList.toggle('on', on); soundBtn.setAttribute('aria-pressed', on);
    soundBtn.setAttribute('aria-label', on ? 'Mute firework sounds' : 'Turn firework sounds on');
  }
  soundBtn.addEventListener('click', e => { e.stopPropagation(); setSound(!soundOn); });
  // browsers only allow sound after a tap: try right away, and switch on with the first touch
  try{ initAudio(); if(ac){ ac.resume().then(() => { if(ac.state === 'running') setSound(true); }); } }catch(e){}
  const firstTouch = e => {
    removeEventListener('pointerdown', firstTouch, true);
    if(e.target.closest && e.target.closest('.sound')) return;   // the speaker button handles itself
    if(!soundOn) setSound(true);
  };
  addEventListener('pointerdown', firstTouch, true);
  if(!AC) soundBtn.hidden = true;

  /* ---------------- fireworks ---------------- */
  const cv = document.getElementById('fireworks'), c = cv.getContext('2d');
  const PALETTES = [
    [[255, 214, 120], [255, 180, 70]], [[255, 120, 170], [255, 200, 225]], [[255, 140, 60], [255, 225, 150]],
    [[190, 120, 255], [255, 170, 225]], [[130, 225, 255], [255, 255, 255]], [[255, 85, 90], [255, 205, 120]], [[150, 255, 170], [255, 245, 170]],
  ];
  const rockets = [], sparks = [];
  function launch(tx, ty){
    const x = tx ?? rnd(W * .1, W * .9), y = ty ?? rnd(H * .12, H * .45);
    const sx = x + rnd(-W * .06, W * .06), frames = 55 + Math.random() * 15;
    rockets.push({ x: sx, y: H + 10, ty: y, vx: (x - sx) / frames, vy: -(H + 10 - y) / frames, t: 0, max: frames + 15 });
    soundLaunch(sx, frames / 60);
  }
  function explode(x, y){
    const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    const kind = Math.random(), scale = Math.max(.8, Math.min(W, H) / 420);
    const ring = kind < .2, willow = kind > .8, crackle = kind > .6 && kind <= .8;
    const n = ring ? 170 : 140, speed = rnd(3.2, 4.8) * scale;
    for(let i = 0; i < n; i++){
      const a = (i / n) * Math.PI * 2 + rnd(-.05, .05);
      const s = speed * (ring ? 1 : Math.cbrt(Math.random()));
      sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: willow ? rnd(110, 150) : rnd(70, 110), max: willow ? 150 : 110, g: willow ? .055 : .04,
        col: willow ? [255, 200, 110] : (Math.random() < .75 ? pal[0] : pal[1]), w: rnd(1.4, 2.6),
        twinkle: Math.random() < .3, crackle });
    }
    sparks.push({ flash: true, x, y, life: 12, max: 12, col: pal[0], r: 150 * scale });
    soundBoom(x, Math.min(1, .55 + scale * .25), crackle);
  }
  function frame(){
    drawStars();
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i]; r.t++;
      const px = r.x, py = r.y; r.x += r.vx; r.y += r.vy;
      c.strokeStyle = 'rgba(255,225,170,.95)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(px, py); c.lineTo(r.x, r.y); c.stroke();
      if(Math.random() < .7) sparks.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: rnd(-.4, .4), vy: rnd(.4, 1.4), life: 22, max: 22, g: .02, col: [255, 190, 110], w: 1 });
      if(r.y <= r.ty || r.t > r.max){ explode(r.x, r.y); rockets.splice(i, 1); }
    }
    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i]; s.life--;
      if(s.life <= 0){ sparks.splice(i, 1); continue; }
      const al = s.life / s.max;
      if(s.flash){
        const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
        g.addColorStop(0, `rgba(${s.col},${.6 * al})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = g; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.29); c.fill(); continue;
      }
      s.px = s.x; s.py = s.y; s.vx *= .978; s.vy = s.vy * .978 + s.g; s.x += s.vx; s.y += s.vy;
      let a = al;
      if(s.twinkle) a *= .5 + Math.random() * .5;
      if(s.crackle && al < .4 && Math.random() < .35) a = 1;
      c.strokeStyle = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${a})`; c.lineWidth = s.w;
      c.beginPath(); c.moveTo(s.px, s.py); c.lineTo(s.x, s.y); c.stroke();
    }
    requestAnimationFrame(frame);
  }

  function size(){
    const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    for(const [el, ctx] of [[cv, c], [sc, s2]]){ el.width = W * d; el.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    makeStars();
  }
  size(); addEventListener('resize', size);

  /* the button to the flowers */
  const next = document.getElementById('next');
  setTimeout(() => next.classList.add('in'), reduce ? 300 : 6000);
  next.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    document.getElementById('veil').classList.add('on');
    setTimeout(() => { location.href = next.href; }, 700);
  });
  next.addEventListener('pointerdown', e => e.stopPropagation());

  if(reduce){ drawStars(); return; }
  requestAnimationFrame(frame);
  [700, 1100, 1500, 1800, 2200].forEach(t => setTimeout(() => launch(), t));
  (function loop(){
    if(!document.hidden){ launch(); if(Math.random() < .35) setTimeout(() => launch(), 260); }
    setTimeout(loop, rnd(900, 1800));
  })();
  // tap the sky for your own firework
  addEventListener('pointerdown', e => {
    if(e.target.closest('.sound, .next')) return;
    launch(e.clientX, Math.min(e.clientY, H * .65));
  });
})();
</script>
</body>
</html>
