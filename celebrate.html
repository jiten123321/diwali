<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0206">
<title>Happy Diwali, Ladoo ❤️</title>
<style>
  :root{color-scheme:dark;}
  html,body{margin:0;height:100%;background:#0b0206;overflow:hidden;}
  body{animation:fadeIn 1.4s ease both;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* night sky backdrop (Gamma-generated photo, with a graceful gradient behind it) */
  .sky{position:fixed;inset:0;background:
      radial-gradient(70% 55% at 50% 60%,rgba(255,140,60,.18),transparent 70%),
      radial-gradient(120% 90% at 50% 0%,#2a0712 0%,#12030a 55%,#070105 100%);}
  .sky img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2.4s ease;filter:saturate(1.08) brightness(.82);}
  .sky img.on{opacity:1;}
  .sky::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 55%,rgba(8,1,4,.15),rgba(8,1,4,.55) 100%);}

  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #fireworks{z-index:2;}
  #petals{z-index:4;pointer-events:none;}

  /* the bouquet */
  .bouquet{position:fixed;left:50%;top:52%;z-index:3;width:min(78vw,62svh,560px);aspect-ratio:1100/1174;transform:translate(-50%,-50%);pointer-events:none;}
  .bouquet .glow{position:absolute;inset:-6% -2% 8%;border-radius:50%;background:radial-gradient(circle,rgba(255,170,200,.30),rgba(255,140,90,.10) 45%,transparent 68%);filter:blur(10px);
    animation:glow 4s ease-in-out infinite;opacity:0;animation-delay:1.6s;animation-fill-mode:both;}
  @keyframes glow{0%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}100%{opacity:.6;transform:scale(.96)}}
  .bouquet img{position:absolute;inset:0;width:100%;height:100%;
    -webkit-mask-image:linear-gradient(#000 82%,transparent 94%);
            mask-image:linear-gradient(#000 82%,transparent 94%);
    filter:drop-shadow(0 0 22px rgba(255,170,200,.25));
    animation:bloom 2.4s cubic-bezier(.2,.7,.2,1) .5s both;}
  @keyframes bloom{0%{opacity:0;transform:scale(.8) translateY(30px);filter:blur(12px) saturate(.6)}60%{filter:blur(0) saturate(1.05)}100%{opacity:1;transform:none;filter:none}}
  .bouquet .sway{position:absolute;inset:0;animation:sway 7s ease-in-out 3s infinite;transform-origin:50% 90%;}
  @keyframes sway{50%{transform:rotate(1.2deg) translateY(-4px)}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;}}
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"><img id="skyImg" alt=""></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div class="bouquet">
    <div class="glow"></div>
    <div class="sway"><img src="assets/img/bouquet.webp" alt="A bouquet of soft pink roses for Ladoo, under Diwali fireworks"></div>
  </div>
  <canvas id="petals" aria-hidden="true"></canvas>

<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* backdrop photo: fades in only once it has loaded */
  // photorealistic Diwali fireworks sky, generated with Gamma
  const SKY = 'https://cdn.gamma.app/n4ay785j5gfy9a4/design-anything/SckNC0qbL8Ab3UHKjuGAz/gsUIvFrJ06EpvR9HqVbxv.jpg';
  const sky = document.getElementById('skyImg');
  sky.onload = () => sky.classList.add('on');
  sky.src = SKY;

  /* ---------------- realistic fireworks ---------------- */
  const cv = document.getElementById('fireworks'), c = cv.getContext('2d');
  let W, H, D;
  function size(){ D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * D; cv.height = H * D; c.setTransform(D, 0, 0, D, 0, 0);
    pc.width = W * D; pc.height = H * D; p2.setTransform(D, 0, 0, D, 0, 0); }

  const PALETTES = [
    [[255, 214, 120], [255, 180, 70]],          // gold
    [[255, 120, 170], [255, 190, 215]],         // pink
    [[255, 140, 60], [255, 220, 140]],          // saffron
    [[200, 120, 255], [255, 160, 220]],         // violet-pink
    [[120, 220, 255], [255, 255, 255]],         // silver-blue
    [[255, 90, 90], [255, 200, 120]],           // red-gold
  ];
  const rockets = [], sparks = [];
  const rnd = (a, b) => a + Math.random() * (b - a);

  function launch(tx, ty){
    const x = tx ?? rnd(W * .12, W * .88);
    const y = ty ?? rnd(H * .1, H * .38);
    const sx = x + rnd(-W * .05, W * .05);
    rockets.push({ x: sx, y: H + 10, tx: x, ty: y, vx: (x - sx) / 60, vy: -(H + 10 - y) / 60, t: 0, trail: [] });
  }
  function explode(x, y){
    const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    const kind = Math.random();
    const n = kind < .2 ? 170 : 130;
    const scale = Math.max(.8, Math.min(W, H) / 420);
    const speed = rnd(3.2, 4.8) * scale;
    for(let i = 0; i < n; i++){
      const a = (i / n) * Math.PI * 2 + rnd(-.05, .05);
      let s = speed * (kind < .2 ? 1 : rnd(.35, 1));        // ring vs peony
      const col = Math.random() < .75 ? pal[0] : pal[1];
      sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(70, 110), max: 110,
        col, w: rnd(1.4, 2.6), twinkle: Math.random() < .35, crackle: kind > .85 && Math.random() < .5 });
    }
    // bright flash
    sparks.push({ flash: true, x, y, life: 12, max: 12, col: pal[0], r: 140 * scale });
  }

  function frame(){
    // fade previous frame for natural light trails while keeping the backdrop visible
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = 'rgba(0,0,0,.18)';
    c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';

    for(let i = rockets.length - 1; i >= 0; i--){
      const r = rockets[i]; r.t++;
      r.px = r.x; r.py = r.y;
      r.x += r.vx; r.y += r.vy; r.vy *= .985;
      c.strokeStyle = 'rgba(255,220,160,.9)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(r.px, r.py); c.lineTo(r.x, r.y); c.stroke();
      // ember sparks falling from the rocket
      if(Math.random() < .6) sparks.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: rnd(-.4, .4), vy: rnd(.5, 1.5), life: 22, max: 22, col: [255, 190, 110], w: 1 });
      if(r.y <= r.ty || r.t > 75){ explode(r.x, r.y); rockets.splice(i, 1); }
    }

    for(let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i]; s.life--;
      if(s.life <= 0){ sparks.splice(i, 1); continue; }
      const al = s.life / s.max;
      if(s.flash){
        const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
        g.addColorStop(0, `rgba(${s.col},${.6 * al})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = g; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.29); c.fill(); continue;
      }
      s.px = s.x; s.py = s.y;
      s.vx *= .978; s.vy = s.vy * .978 + .04;   // drag + gravity
      s.x += s.vx; s.y += s.vy;
      let a = al;
      if(s.twinkle) a *= .5 + Math.random() * .5;
      if(s.crackle && al < .35 && Math.random() < .3) a = 1;
      c.strokeStyle = `rgba(${s.col[0]},${s.col[1]},${s.col[2]},${a})`;
      c.lineWidth = s.w;
      c.beginPath(); c.moveTo(s.px, s.py); c.lineTo(s.x, s.y); c.stroke();
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- falling rose petals ---------------- */
  const pc = document.getElementById('petals'), p2 = pc.getContext('2d');
  let petals = [];
  const mkPetal = top => ({ x: Math.random() * W, y: top ? -30 : Math.random() * H, s: 6 + Math.random() * 8, vy: .4 + Math.random() * .6,
    sw: Math.random() * 6.28, sws: .01 + Math.random() * .015, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .03, flip: Math.random() * 6.28, vf: .02 + Math.random() * .03, hue: Math.random() });
  function petal(p){
    p2.save(); p2.translate(p.x, p.y); p2.rotate(p.rot); p2.scale(Math.cos(p.flip) * .8 + .2 * Math.sign(Math.cos(p.flip) || 1), 1);
    const s = p.s, g = p2.createRadialGradient(-s * .2, -s * .3, s * .1, 0, 0, s * 1.2);
    const a = p.hue < .5 ? ['#fde0ea', '#f4a3be', '#d9658e'] : ['#fbd3e1', '#ee93b3', '#cf5a84'];
    g.addColorStop(0, a[0]); g.addColorStop(.6, a[1]); g.addColorStop(1, a[2]);
    p2.fillStyle = g; p2.globalAlpha = .85;
    p2.beginPath(); p2.moveTo(0, s); p2.bezierCurveTo(s * 1.1, s * .5, s * .9, -s * 1.1, 0, -s * .75); p2.bezierCurveTo(-s * .9, -s * 1.1, -s * 1.1, s * .5, 0, s); p2.fill();
    p2.restore();
  }
  function petalFrame(){
    p2.clearRect(0, 0, W, H);
    for(const p of petals){
      p.sw += p.sws; p.x += Math.sin(p.sw) * .7; p.y += p.vy; p.rot += p.vr; p.flip += p.vf;
      if(p.y > H + 30) Object.assign(p, mkPetal(true));
      petal(p);
    }
    requestAnimationFrame(petalFrame);
  }

  size();
  addEventListener('resize', size);
  petals = Array.from({ length: Math.round(Math.min(18, W * H / 50000) + 5) }, () => mkPetal(false));

  if(reduce){ petals.forEach(petal); return; }
  requestAnimationFrame(frame);
  requestAnimationFrame(petalFrame);

  // a grand opening volley, then a gentle, endless show
  [900, 1300, 1700, 2000, 2400].forEach(t => setTimeout(() => launch(), t));
  (function loop(){
    if(!document.hidden){ launch(); if(Math.random() < .35) setTimeout(() => launch(), 250); }
    setTimeout(loop, rnd(900, 1800));
  })();

  // tap anywhere for your own firework
  addEventListener('pointerdown', e => launch(e.clientX, Math.min(e.clientY, H * .6)));
})();
</script>
</body>
</html>
