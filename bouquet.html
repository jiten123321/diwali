<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Red Roses for Ladoo</title>
<style>
  /* a completely black night, so the bouquet photo (shot on black) shows in full */
  :root{color-scheme:dark;--gold:#d6b16f;}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;}
  body{animation:fadeIn 1.2s ease both;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  /* one screen-sized frame, so nothing can widen the page */
  .scene{position:fixed;inset:0;overflow:hidden;}
  .bg{position:absolute;inset:0;background:#000;}

  /* the whole bouquet always fits on screen, nothing cropped, faded or blended away */
  .bouquet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw, 92svh * 4 / 5, 900px);aspect-ratio:4/5;}
  .bouquet img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;opacity:0;}
  .bouquet img.ready{animation:bloom 2.4s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes bloom{0%{opacity:0;transform:scale(.84) translateY(30px);filter:blur(12px) saturate(.7)}60%{filter:blur(0) saturate(1.05)}100%{opacity:1;transform:none;filter:none}}
  .sway{position:absolute;inset:0;animation:sway 8s ease-in-out 2.8s infinite;transform-origin:50% 92%;}
  @keyframes sway{50%{transform:rotate(.7deg) translateY(-5px)}}

  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
  /* back to the beginning: a gold pill, like the buttons on the other pages */
  .again{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:5;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1);
    display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:999px;text-decoration:none;white-space:nowrap;
    background:linear-gradient(180deg,#efd9a6,#d6b16f 55%,#a67c3a);color:#2a0710;
    font-family:"Jost","Helvetica Neue",Arial,sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;
    box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);}
  .again.in{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .again:active{transform:translate(-50%,0) scale(.97);}
  .veil{position:fixed;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .7s;}
  .veil.on{opacity:1;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;}}
</style>
</head>
<body>
  <div class="scene">
  <div class="bg" aria-hidden="true"></div>
  <canvas id="sparkles" aria-hidden="true"></canvas>
  <div class="bouquet"><div class="sway">
    <img id="bouquet" alt="A huge bouquet of deep red roses for Ladoo">
  </div></div>
  </div>
  <canvas id="glitter" aria-hidden="true"></canvas>
  <a class="again" id="again" href="index.html">↺ Back to the beginning</a>
  <div class="veil" id="veil"></div>
<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* a realistic bouquet generated with Gamma; a red cut-out of the original bouquet is the fallback */
  const BOUQUET = 'https://cdn.gamma.app/n4ay785j5gfy9a4/design-anything/y0mtft3XhDHF2mb4EIaYv/m0zoyl8OiBw4bNhKtfmtW.jpg';
  const img = document.getElementById('bouquet');
  img.onload = () => img.classList.add('ready');
  img.onerror = () => { img.onerror = null; img.classList.add('fallback'); img.src = 'assets/img/bouquet-cutout-red.webp'; };
  img.src = BOUQUET;

  let W, H, D = 1;
  /* soft golden sparkles, like the rest of the site (one pre-rendered glow, reused) */
  const spark = (() => { const g = document.createElement('canvas'); g.width = g.height = 32; const x = g.getContext('2d');
    const gr = x.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'hsla(42,100%,82%,1)'); gr.addColorStop(1, 'hsla(42,100%,60%,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 32, 32); return g; })();
  const sc = document.getElementById('sparkles'), s2 = sc.getContext('2d');
  let sp = [];
  const mkS = bottom => ({ x: Math.random() * W, y: bottom ? H + 10 : Math.random() * H, r: .6 + Math.random() * 1.8,
    vy: -(.12 + Math.random() * .35), a: Math.random() * 6.28, va: .01 + Math.random() * .03 });

  /* glitter rain: tiny metallic flecks that tumble and catch the light as they fall */
  const pc = document.getElementById('glitter'), c = pc.getContext('2d');
  let ps = [];
  const GLITTER = [[255, 214, 120], [246, 196, 98], [255, 236, 190], [244, 170, 160], [255, 182, 200], [235, 235, 245]];
  const mk = top => ({ x: Math.random() * W, y: top ? -10 - Math.random() * 40 : Math.random() * H,
    w: 2.6 + Math.random() * 3.4, h: 1.6 + Math.random() * 2.2, vy: .6 + Math.random() * 1.3, vx: (Math.random() - .5) * .3,
    sw: Math.random() * 6.28, sws: .02 + Math.random() * .04, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .12,
    flip: Math.random() * 6.28, vf: .06 + Math.random() * .14, col: GLITTER[Math.floor(Math.random() * GLITTER.length)] });
  function fleck(p){
    const face = Math.cos(p.flip);                       // which way the fleck is facing
    const glint = Math.pow(Math.abs(face), 6);            // flashes when it faces you
    const [r, g, b] = p.col;
    const sx = .25 + .75 * Math.abs(face), co = Math.cos(p.rot), si = Math.sin(p.rot);
    c.setTransform(D * co * sx, D * si * sx, -D * si, D * co, D * p.x, D * p.y);
    c.fillStyle = `rgba(${Math.min(255, r + 40 * glint)},${Math.min(255, g + 40 * glint)},${Math.min(255, b + 40 * glint)},${.75 + .25 * glint})`;
    c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    c.setTransform(D, 0, 0, D, 0, 0);
    if(glint > .45){                                        // a tiny star-shaped sparkle on the brightest flashes
      const L = p.w * 2.6 * glint;
      c.strokeStyle = `rgba(255,250,235,${glint * .85})`; c.lineWidth = .7;
      c.beginPath(); c.moveTo(p.x - L, p.y); c.lineTo(p.x + L, p.y); c.moveTo(p.x, p.y - L); c.lineTo(p.x, p.y + L); c.stroke();
    }
  }
  function size(){
    const d = D = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
    for(const [el, ctx] of [[pc, c], [sc, s2]]){ el.width = W * d; el.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    ps = Array.from({ length: Math.round(Math.min(420, W * H / 2600)) }, () => mk(false));
    sp = Array.from({ length: Math.round(Math.min(60, W * H / 22000)) }, () => mkS(false));
  }
  function tick(){
    c.clearRect(0, 0, W, H); s2.clearRect(0, 0, W, H);
    s2.globalCompositeOperation = 'lighter';
    for(const p of sp){
      p.a += p.va; p.y += p.vy; p.x += Math.sin(p.a) * .15;
      if(p.y < -10) Object.assign(p, mkS(true));
      const tw = .45 + Math.sin(p.a * 2) * .35, R = p.r * 4;
      s2.globalAlpha = Math.max(0, tw); s2.drawImage(spark, p.x - R, p.y - R, R * 2, R * 2);
    }
    s2.globalAlpha = 1;
    for(const p of ps){
      p.sw += p.sws; p.x += p.vx + Math.sin(p.sw) * .35; p.y += p.vy; p.rot += p.vr; p.flip += p.vf;
      if(p.y > H + 10) Object.assign(p, mk(true));
      fleck(p);
    }
    if(!reduce) requestAnimationFrame(tick);
  }
  size(); addEventListener('resize', size); requestAnimationFrame(tick);

  /* the way back to the start, shown once the bouquet has bloomed */
  const again = document.getElementById('again');
  setTimeout(() => again.classList.add('in'), reduce ? 300 : 4500);
  again.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('veil').classList.add('on');
    setTimeout(() => { location.href = again.href; }, 700);
  });
})();
</script>
</body>
</html>
