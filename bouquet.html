<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0710">
<title>Pink Roses for Ladoo</title>
<style>
  /* same palette as the rest of the site: wine, burgundy, maroon and champagne gold */
  :root{color-scheme:dark;--wine:#2a0710;--burgundy:#4a0d1c;--maroon:#6e1427;--gold:#d6b16f;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--wine);}
  body{animation:fadeIn 1.2s ease both;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .bg{position:fixed;inset:0;background:
      radial-gradient(55% 50% at 50% 46%,rgba(214,177,111,.22),transparent 70%),
      radial-gradient(90% 80% at 50% 40%,var(--maroon) 0%,var(--burgundy) 45%,var(--wine) 80%,#160309 100%);}

  /* the Gamma photo sits on pure black: "lighten" drops the black out so the page's burgundy shows through */
  .bouquet{mix-blend-mode:lighten;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw, 94svh * 4 / 5, 900px);aspect-ratio:4/5;}
  @media (max-aspect-ratio:3/4){.bouquet{width:min(118vw, 94svh * 4 / 5);}}
  .bouquet img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    /* feather the photo's edges as a safety net */
    -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 82%,transparent 100%);
            mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 82%,transparent 100%);
    opacity:0;}
  .bouquet img.fallback{-webkit-mask-image:none;mask-image:none;object-fit:contain;filter:drop-shadow(0 0 30px rgba(255,170,200,.25));}
  .bouquet img.ready{animation:bloom 2.4s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes bloom{0%{opacity:0;transform:scale(.84) translateY(30px);filter:blur(12px) saturate(.7)}60%{filter:blur(0) saturate(1.05)}100%{opacity:1;transform:none;filter:none}}
  .sway{position:absolute;inset:0;animation:sway 8s ease-in-out 2.8s infinite;transform-origin:50% 92%;}
  @keyframes sway{50%{transform:rotate(.7deg) translateY(-5px)}}

  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;}}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <canvas id="sparkles" aria-hidden="true"></canvas>
  <div class="bouquet"><div class="sway">
    <img id="bouquet" alt="A huge bouquet of soft pink roses for Ladoo">
  </div></div>
  <canvas id="glitter" aria-hidden="true"></canvas>
<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* a realistic bouquet generated with Gamma; a cut-out of the original bouquet is the fallback */
  const BOUQUET = 'https://cdn.gamma.app/n4ay785j5gfy9a4/design-anything/vIsqIQywkO1SZ2SKNNxX1/Z-ZVfBSMuWiTqXuLOaOkW.jpg';
  const img = document.getElementById('bouquet');
  img.onload = () => img.classList.add('ready');
  img.onerror = () => { img.onerror = null; img.classList.add('fallback'); img.parentNode.parentNode.style.mixBlendMode = 'normal'; img.src = 'assets/img/bouquet-cutout.webp'; };
  img.src = BOUQUET;

  let W, H;
  /* soft golden sparkles, like the rest of the site */
  const sc = document.getElementById('sparkles'), s2 = sc.getContext('2d');
  let sp = [];
  const mkS = bottom => ({ x: Math.random() * W, y: bottom ? H + 10 : Math.random() * H, r: .6 + Math.random() * 1.8,
    vy: -(.12 + Math.random() * .35), a: Math.random() * 6.28, va: .01 + Math.random() * .03 });

  /* glitter rain: tiny metallic flecks that tumble and catch the light as they fall */
  const pc = document.getElementById('glitter'), c = pc.getContext('2d');
  let ps = [];
  const GLITTER = [[255, 214, 120], [246, 196, 98], [255, 236, 190], [244, 170, 160], [255, 182, 200], [235, 235, 245]];
  const mk = top => ({ x: Math.random() * W, y: top ? -10 - Math.random() * 40 : Math.random() * H,
    w: 2.6 + Math.random() * 3.4, h: 1.6 + Math.random() * 2.2, vy: .6 + Math.random() * 1.3, vx: (Math.random() - .5) * .3,
    sw: Math.random() * 6.28, sws: .02 + Math.random() * .04, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .12,
    flip: Math.random() * 6.28, vf: .06 + Math.random() * .14, col: GLITTER[Math.floor(Math.random() * GLITTER.length)] });
  function fleck(p){
    const face = Math.cos(p.flip);                       // which way the fleck is facing
    const glint = Math.pow(Math.abs(face), 6);            // flashes when it faces you
    const [r, g, b] = p.col;
    c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(.25 + .75 * Math.abs(face), 1);
    c.fillStyle = `rgba(${Math.min(255, r + 40 * glint)},${Math.min(255, g + 40 * glint)},${Math.min(255, b + 40 * glint)},${.75 + .25 * glint})`;
    c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    c.restore();
    if(glint > .45){                                        // a tiny star-shaped sparkle on the brightest flashes
      const L = p.w * 2.6 * glint;
      c.strokeStyle = `rgba(255,250,235,${glint * .85})`; c.lineWidth = .7;
      c.beginPath(); c.moveTo(p.x - L, p.y); c.lineTo(p.x + L, p.y); c.moveTo(p.x, p.y - L); c.lineTo(p.x, p.y + L); c.stroke();
    }
  }
  function size(){
    const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    for(const [el, ctx] of [[pc, c], [sc, s2]]){ el.width = W * d; el.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
    ps = Array.from({ length: Math.round(Math.min(420, W * H / 2600)) }, () => mk(false));
    sp = Array.from({ length: Math.round(Math.min(60, W * H / 22000)) }, () => mkS(false));
  }
  function tick(){
    c.clearRect(0, 0, W, H); s2.clearRect(0, 0, W, H);
    s2.globalCompositeOperation = 'lighter';
    for(const p of sp){
      p.a += p.va; p.y += p.vy; p.x += Math.sin(p.a) * .15;
      if(p.y < -10) Object.assign(p, mkS(true));
      const tw = .45 + Math.sin(p.a * 2) * .35, g = s2.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, `hsla(42,100%,82%,${tw})`); g.addColorStop(1, 'hsla(42,100%,60%,0)');
      s2.fillStyle = g; s2.beginPath(); s2.arc(p.x, p.y, p.r * 4, 0, 6.29); s2.fill();
    }
    for(const p of ps){
      p.sw += p.sws; p.x += p.vx + Math.sin(p.sw) * .35; p.y += p.vy; p.rot += p.vr; p.flip += p.vf;
      if(p.y > H + 10) Object.assign(p, mk(true));
      fleck(p);
    }
    if(!reduce) requestAnimationFrame(tick);
  }
  size(); addEventListener('resize', size); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
