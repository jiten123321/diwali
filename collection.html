<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0710">
<title>The Festive Edit — Gulaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Parisienne&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .page-hero{position:relative;z-index:4;background:var(--wine);color:var(--ivory);padding:clamp(56px,8vw,110px) 0 clamp(48px,6vw,80px);overflow:hidden;}
  .page-hero::after{content:"";position:absolute;right:-10%;top:-40%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(227,129,47,.3),transparent 65%);}
  .page-hero .crumbs{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(251,244,236,.55);margin-bottom:18px;}
  .page-hero .crumbs a{text-decoration:none;}
  .page-hero h1{max-width:12em;}
  .page-hero .lede{margin-top:16px;}

  .toolbar{position:sticky;top:72px;z-index:30;background:rgba(251,244,236,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .toolbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:9px 18px;font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;transition:all .3s;}
  .chip:hover{border-color:var(--maroon);}
  .chip.on{background:var(--maroon);border-color:var(--maroon);color:var(--ivory);}
  .chip i{font-style:normal;opacity:.6;margin-left:4px;}
  .sort{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;flex:none;}
  .sort select{font:inherit;letter-spacing:.06em;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:6px 2px;color:inherit;}
  @media (max-width:640px){.sort span{display:none;}}

  .results{display:flex;justify-content:space-between;align-items:baseline;margin:36px 0 24px;font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
  .grid .card{transition:opacity .45s, transform .45s var(--ease);}
  .grid .card.hide{display:none;}

  .editorial{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.2fr;background:var(--maroon);color:var(--ivory);overflow:hidden;min-height:300px;}
  .editorial .media{min-height:280px;}
  .editorial .txt{padding:clamp(28px,5vw,64px);display:grid;align-content:center;gap:14px;}
  .editorial h3{font-size:clamp(26px,3vw,38px);}
  .editorial p{margin:0;color:rgba(251,244,236,.8);}
  .editorial .btn{justify-self:start;margin-top:8px;}
  @media (max-width:700px){.editorial{grid-template-columns:1fr;}}
  .grid.filtered .editorial{display:none;}
</style>
</head>
<body data-page="collection" data-sparkles="low">
<main>
  <section class="page-hero grain">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> / The Festive Edit</div>
      <div class="eyebrow">Diwali 2026 · 16 handcrafted pieces</div>
      <h1 style="margin-top:14px">The Festive <em style="color:var(--gold-2)">Collection</em></h1>
      <p class="lede">Silks that hold the glow of a diya, jewellery that chimes when you laugh, and little bags for big evenings.</p>
    </div>
  </section>

  <div class="toolbar">
    <div class="wrap">
      <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
      <label class="sort"><span>Sort</span>
        <select id="sort" aria-label="Sort products">
          <option value="featured">Featured</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="name">A – Z</option>
        </select>
      </label>
    </div>
  </div>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="results"><span id="count">16 pieces</span><span>Complimentary gift-wrap</span></div>
      <div class="grid" id="grid"></div>

      <div class="next-chapter" style="margin-top:80px">
        <a href="index.html"><span class="k">Back</span><span class="t">Home</span></a>
        <a href="styling.html" style="text-align:right"><span class="k">Next — a private appointment</span><span class="t">The Styling Room <span>→</span></span></a>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/shop.js"></script>
<script>
(function(){
  const G = window.GULAAB, { $, $$ } = G;
  const grid = $('#grid'), chips = $('#chips');
  let cat = 'all', sort = 'featured';

  const editorial = `<aside class="editorial reveal">
    <div class="media"><img data-img="lehengaParty" data-w="900" alt="A festive lehenga styled for Diwali night"></div>
    <div class="txt">
      <div class="eyebrow">A note from the atelier</div>
      <h3>Can’t decide? You don’t have to.</h3>
      <p>Our stylist has set aside an evening — and a whole room — to help one guest find their Diwali look. (It’s you. It’s been you all along.)</p>
      <a class="btn gold" href="styling.html">Help me choose</a>
    </div></aside>`;

  chips.innerHTML = Object.entries(G.CATS).map(([k, v]) => {
    const n = k === 'all' ? G.PRODUCTS.length : G.PRODUCTS.filter(p => p.cat === k).length;
    return `<button class="chip" role="tab" data-cat="${k}">${v}<i>${n}</i></button>`;
  }).join('');

  function render(){
    let list = G.PRODUCTS.filter(p => cat === 'all' || p.cat === cat);
    if(sort === 'low') list = [...list].sort((a, b) => a.price - b.price);
    if(sort === 'high') list = [...list].sort((a, b) => b.price - a.price);
    if(sort === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    const cards = list.map((p, i) => G.card(p, i));
    if(cat === 'all' && sort === 'featured') cards.splice(8, 0, editorial);
    grid.innerHTML = cards.join('');
    $('#count').textContent = `${list.length} piece${list.length === 1 ? '' : 's'}`;
    $$('.chip', chips).forEach(c => { const on = c.dataset.cat === cat; c.classList.toggle('on', on); c.setAttribute('aria-selected', on); });
    G.hydrateImages(grid);
    requestAnimationFrame(() => G.reveal(grid));
  }

  chips.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if(!c) return;
    cat = c.dataset.cat; history.replaceState(null, '', cat === 'all' ? location.pathname : '#' + cat); render();
  });
  $('#sort').addEventListener('change', e => { sort = e.target.value; render(); });

  const fromHash = () => { const h = location.hash.slice(1); cat = G.CATS[h] ? h : 'all'; render(); };
  addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
</body>
</html>
